# radar_configs/cascade_tx8_rx16_5rps.toml
# 8-chirp / 4-TX-device (Dev1+Dev2+Dev3+Dev4) / 16-RX (all 4 devices) preset
# (--radar-config cascade_tx8_rx16_5rps). Derived from
# cascade_tx5_rx16_5rps_v2.toml - same profile (76 GHz start, 100 MHz/us,
# idle 7/7/7 us, ramp 40 us, 160 samples @ 4850 ksps) and same 255-per-frame
# loop count; only the TX geometry and frame period change.
#
# Global TX numbering (local T0/T1/T2 per device):
#   Dev1 = TX1/2/3, Dev2 = TX4/5/6, Dev3 = TX7/8/9, Dev4 = TX10/11/12
# Keeps the 5-TX preset's TX4, TX6, TX8, TX10, TX12 unchanged and adds all
# three Dev1 (master) antennas TX1/2/3. Fired in ascending order:
#   TX1, TX2, TX3, TX4, TX6, TX8, TX10, TX12
#   Dev1 (master):  TX on (T0 + T1 + T2), RX on   <- new vs 5-TX preset
#   Dev2 (slave1):  TX on (T0 + T2), RX on
#   Dev3 (slave2):  TX on (middle / T1 = TX8), RX on
#   Dev4 (slave3):  TX on (T0 + T2), RX on
# All 16 physical RX active (4 devices x 4 RX).
#
# FRAME FIT: 8 chirps x (7 + 40) us = 376 us/loop x 255 loops = 95.9 ms of
# active chirping per frame. That doesn't fit the 5-TX preset's 62 ms period,
# so framePeriodicity is raised to 98 ms - leaves 2.1 ms spare per frame,
# the same absolute spare time as cascade_tx5_rx16_5rps_v2 (59.9 of 62 ms).
# numLoops kept at 255. Frame rate drops from ~16 to ~10.2 Hz.
#
# DATA RATE note: 160 x 8 x 255 x 16 RX x 4 bytes / 0.098 s ~= 213 MB/s.
# Mid-capture frame drops track the radar config (see mimo.py FRAME DROPS).
# Prefer cascade_baseline.toml for a known-clean reference.
#
# Copy this file to add a new preset; select with --radar-config <name>.

[mimo.profile]
id = 0
startFrequency =  76            # Chirp start frequency in GHz
frequencySlope =  100           # Frequency slope in MHz/us (mimo.c PATCHED value)
idleTimes = [7, 7, 7]           # Per-profile idle times (us) - profile0/1/2 for chirp0/1/2
adcStartTime = 5                # ADC start time in us
numAdcSamples =  160            # Number of ADC samples per chirp
adcSamplingFrequency = 4850     # ADC sampling frequency in ksps (matches AWR1843 reference SAMPLE_RATE)
rampEndTime = 40                # Chirp ramp end time in us (mimo.c PATCHED value)
rxGain = 48                     # dB
txStartTime = 0                 # TX starttime in us
hpfCornerFreq1 = 0              # 0: 175kHz
hpfCornerFreq2 = 0              # 0: 350kHz
pfVcoSelect = 0x02              # AWR2243: 0x02 = VCO2 (77-81 GHz) - matches mmwcas/mimo.c pfVcoSelect
pfCalLutUpdate = 0x00
txOutPowerBackoffCode = 0x00
txPhaseShifter = 0x00

[mimo.frame]
numLoops =  255                 # same as the 5-TX preset
numFrames = 0                   # Overridden by mimo.py --frames (0 in TOML = unused)
framePeriodicity = 98           # ms - was 62 in the 5-TX preset, see FRAME FIT above
chirpStartIdx = 0
chirpEndIdx = 7                 # 8 chirps (0-7)
frameTriggerDelay = 0.0
triggerSelectMaster = 1         # software trigger
triggerSelectSlave = 2          # hardware sync from master

[mimo.channel]
# Per-device RX mask [Dev1, Dev2, Dev3, Dev4]. All 4 devices enabled with all
# 4 RX each -> 16 physical RX.
rxChannelEn = [0x0F, 0x0F, 0x0F, 0x0F]
txChannelEn = 0x07              # Enable all 3 TX channels

# Chirp geometry: per-device local TX antenna index per chirp (-1 = TX off).
# Global TX:  1  2  3  4  6  8 10 12
# Chirp:      0  1  2  3  4  5  6  7
# Dev1:      T0 T1 T2 -- -- -- -- --
# Dev2:      -- -- -- T0 T2 -- -- --
# Dev3:      -- -- -- -- -- T1 -- --
# Dev4:      -- -- -- -- -- -- T0 T2
[mimo.chirp]
numChirps = 8
# profile id = local TX index (same convention as the 5-TX preset)
profileIdPerChirp = [0, 1, 2, 0, 2, 1, 0, 2]
txAntennaTable = [
    [0, 1, 2, -1, -1, -1, -1, -1],       # Dev1 master: TX0/1/2 on chirp0/1/2 (TX1/2/3) - new
    [-1, -1, -1, 0, 2, -1, -1, -1],      # Dev2 slave1: TX0/TX2 on chirp3/4 (TX4/6)
    [-1, -1, -1, -1, -1, 1, -1, -1],     # Dev3 slave2: TX1 (middle / TX8) on chirp5
    [-1, -1, -1, -1, -1, -1, 0, 2],      # Dev4 slave3: TX0/TX2 on chirp6/7 (TX10/12)
]
startFreqVar_MHz = 0.0
freqSlopeVar_KHz_usec = 0.0
idleTimeVar_usec = 0.0
adcStartTimeVar_usec = 0.0

[mimo.rfInit]
# Documentation-only: MMWL_rfInit() (the SDK wrapper mmw_set_config() calls)
# takes no calibEnMask parameter, so this value is written to the
# .mmwave.json sidecar but not actually applied to the chip.
calibEnMask = 0x1FF0             # matches MMWL_rfInit / Studio boot cals

[mimo.adcOut]
adcBits = 2                      # 16-bit
fullScaleReducFctr = 0
adcOutFmt = 1                    # complex

[mimo.lowPower]
lpAdcMode = 0

[mimo.misc]
miscCtl = 1                      # per-chirp phase shifter enable

[mimo.ldo]
ldoBypassEnable = 3
supplyMonIrDrop = 0
ioSupplyIndicator = 0

[mimo.datapath]
iqSwapSel = 0
chInterleave = 0
intfSel = 0                      # CSI2
transferFmtPkt0 = 1
transferFmtPkt1 = 0
cqConfig = 0
cq0TransSize = 0
cq1TransSize = 0
cq2TransSize = 0                 # documentation-only: rlDevDataPathCfg_t has
                                  # no cq2TransSize field, not applied to the chip
laneClkCfg = 1                   # 0=SDR, 1=DDR
dataRate_Mbps = 600              # mapped to dataRate/hsiClk SDK codes at runtime;
                                  # valid DDR rates: 600/450/400/300/225/150
lanePosPolSel = 0x35421
lineStartEndDis = 0
