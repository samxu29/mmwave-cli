# radar_configs/cascade_tx3_rx8.toml
# Dev1+Dev4 sub-array variant of cascade_tx3_rx16 (--radar-config cascade_tx3_rx8).
#
# GEOMETRY: only Dev1 (master) and Dev4 (slave3) are active, each with all 4 RX
# -> 8 physical RX, 3 TX (Dev4) -> 24-element virtual array. Dev2 (slave1) and
# Dev3 (slave2) are DROPPED entirely: not powered, configured, or captured, so
# NO slave1_0000_data.bin / slave2_0000_data.bin are written at all (only
# master_* and slave3_* appear in the capture dir). This is a two-widely-spaced
# 4-RX-block layout, distinct from cascade_tx3_rx16's contiguous 16-RX line.
#
# HOW IT WORKS: rxChannelEn is a per-device LIST. An entry of 0 drops that
# device from the cascade deviceMap (mmwcas.pyx derives deviceMap from this
# table). This is the SUPPORTED way to build sub-arrays - unlike keeping a
# device ENABLED with 0 RX, which still fails (stock TDA computes width from RX
# popcount and CreateApp times out at -8 on a width-0 VIP port). Dropping the
# whole device avoids that because the TDA never opens a port for it. Dev1
# (master) can never be dropped - it is the cascade LO/timing source.
#
# NOTE (hardware): running the cascade with the middle slaves (Dev2/Dev3)
# unpowered is non-standard; the 20 GHz LO is distributed across the RF board,
# so verify Dev4 still locks/captures on real hardware.
#
# DATA RATE: 256 x 3 x 255 x 4 RX x 4 bytes x 2 dev / 0.1 s ~= 62 MB/s - same as
# the old 2-RX x 4-dev layout, so this does NOT change bandwidth or frame drops
# (those are a chirp-schedule duty-cycle problem); it only changes geometry.
#
# Downstream processing MUST match 8 physical RX (Dev1 x4 + Dev4 x4) before
# beamforming. Everything else matches cascade_tx3_rx16.

[mimo.profile]
id = 0
startFrequency = 77             # Chirp start frequency in GHz
frequencySlope = 60             # Frequency slope in MHz/us (mimo.c PATCHED value)
# Per-profile idle times (us) - profile0/1/2 for chirp0/1/2
idleTimes = [175, 7, 7]
adcStartTime = 6                # ADC start time in us
numAdcSamples = 256             # Number of ADC samples per chirp
adcSamplingFrequency = 4400     # ADC sampling frequency in ksps (matches AWR1843 reference SAMPLE_RATE)
rampEndTime = 65                # Chirp ramp end time in us (mimo.c PATCHED value)
rxGain = 48                     # dB
txStartTime = 0                 # TX starttime in us
hpfCornerFreq1 = 0              # 0: 175kHz
hpfCornerFreq2 = 0              # 0: 350kHz
pfVcoSelect = 0x02              # AWR2243: 0x02 = VCO2 (77-81 GHz) - matches mmwcas/mimo.c pfVcoSelect
pfCalLutUpdate = 0x00
txOutPowerBackoffCode = 0x00
txPhaseShifter = 0x00

[mimo.frame]
numLoops = 255                  # mimo.c PATCHED value (was 16)
numFrames = 0                   # Overridden by mimo.py --frames (0 in TOML = unused)
framePeriodicity = 100          # ms - mimo.c PATCHED value (was 50; 10Hz frame rate)
chirpStartIdx = 0
chirpEndIdx = 2                 # 3 chirps (0-2)
frameTriggerDelay = 0.0
triggerSelectMaster = 1         # software trigger
triggerSelectSlave = 2          # hardware sync from master

[mimo.channel]
# Per-device RX mask [Dev1, Dev2, Dev3, Dev4]. 0 = drop that device entirely
# (no .bin written). Dev1+Dev4 with all 4 RX -> 8 physical RX.
rxChannelEn = [0x0F, 0x00, 0x00, 0x0F]
txChannelEn = 0x07              # Enable all 3 TX channels

# Chirp geometry: per-device local TX antenna index per chirp (-1 = TX off).
# Matches mmwcas/mimo.c chripTxTable - only Dev4 (index 3) transmits.
# Dev2/Dev3 rows are RX-only placeholders; those devices are dropped anyway
# (rxChannelEn=0), so their rows must stay all -1 (no TX on a dropped device).
[mimo.chirp]
numChirps = 3
profileIdPerChirp = [0, 1, 2]
txAntennaTable = [
    [-1, -1, -1],                # Dev1 master: RX only (4 RX active)
    [-1, -1, -1],                # Dev2 slave1: DROPPED (rxChannelEn=0)
    [-1, -1, -1],                # Dev3 slave2: DROPPED (rxChannelEn=0)
    [0, 1, 2],                   # Dev4 slave3: TX0/TX1/TX2 on chirp0/1/2 (4 RX active)
]
startFreqVar_MHz = 0.0
freqSlopeVar_KHz_usec = 0.0
idleTimeVar_usec = 0.0
adcStartTimeVar_usec = 0.0

[mimo.rfInit]
# Documentation-only: MMWL_rfInit() (the SDK wrapper mmw_set_config() calls)
# takes no calibEnMask parameter, so this value is written to the
# .mmwave.json sidecar but not actually applied to the chip.
calibEnMask = 0x1FF0             # matches MMWL_rfInit / Studio boot cals

[mimo.adcOut]
adcBits = 2                      # 16-bit
fullScaleReducFctr = 0
adcOutFmt = 1                    # complex

[mimo.lowPower]
lpAdcMode = 0

[mimo.misc]
miscCtl = 1                      # per-chirp phase shifter enable

[mimo.ldo]
ldoBypassEnable = 3
supplyMonIrDrop = 0
ioSupplyIndicator = 0

[mimo.datapath]
iqSwapSel = 0
chInterleave = 0
intfSel = 0                      # CSI2
transferFmtPkt0 = 1
transferFmtPkt1 = 0
cqConfig = 0
cq0TransSize = 0
cq1TransSize = 0
cq2TransSize = 0                 # documentation-only: rlDevDataPathCfg_t has
                                  # no cq2TransSize field, not applied to the chip
laneClkCfg = 1                   # 0=SDR, 1=DDR
dataRate_Mbps = 600              # mapped to dataRate/hsiClk SDK codes at runtime;
                                  # valid DDR rates: 600/450/400/300/225/150
lanePosPolSel = 0x35421
lineStartEndDis = 0
